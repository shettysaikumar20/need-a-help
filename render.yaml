services:
  - type: web
    name: need-a-help
    runtime: node
    plan: free

    buildCommand: npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: npm --prefix backend start

    healthCheckPath: /api/health
    autoDeployTrigger: "off"

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: BACKBOARD_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: OLLAMA_URL
        value: "http://127.0.0.1:11434"

      - key: OLLAMA_MODEL
        value: "gemma3:270m"
